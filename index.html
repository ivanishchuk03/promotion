<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акция — Аркадия Гостевой Дом</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>

<body>

    <main class="page-container">
        <div class="promo-card">

            <!-- Верхній банер з акцією -->
            <div class="promo-banner">
                <img src="assets/images/promotion_4.webp" alt="Акция: скидки до 30%">
            </div>

            <!-- Основний контент з формою -->
            <div class="promo-content">

                <!-- Логотип гостьового дому -->
                <div class="brand-logo">
                    <img src="assets/images/logo_300x150.svg" alt="Аркадия Гостевой Дом">
                </div>

                <!-- Підзаголовок форми -->
                <p class="form-subtitle">Оставьте свои контакты и мы свяжемся с Вами</p>

                <!-- Форма контактних даних -->
                <form id="leadForm" class="contact-form" novalidate>

                    <div class="form-group">
                        <label for="fullName">Ваше Имя Фамилия</label>
                        <input type="text" id="fullName" name="fullName" required minlength="2"
                            placeholder="Иван Иванов" autocomplete="name">
                        <span class="error-text" id="fullNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Ваш номер телефона</label>
                        <input type="tel" id="phone" name="phone" required pattern="^\+?[0-9\s\-\(\)]{10,18}$"
                            placeholder="+7 (978) 000-00-00" autocomplete="tel">
                        <span class="error-text" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Ваш E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.com"
                            autocomplete="email">
                        <span class="error-text" id="emailError"></span>
                    </div>

                    <!-- Блок згоди на обробку даних -->
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label" for="consent">
                            <input type="checkbox" id="consent" name="consent" required>
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-text">
                                Я даю согласие на обработку моих персональных данных в целях обработки заявки и обратной
                                связи.
                            </span>
                        </label>
                        <p class="consent-hint">
                            Вы можете отозвать своё согласие, написав на почту <a
                                href="mailto:arkadiaotel@mail.ru">arkadiaotel@mail.ru</a>
                        </p>
                        <span class="error-text" id="consentError"></span>
                    </div>

                    <button type="submit" class="btn-submit">Отправить</button>

                    <div class="form-status" id="formStatus"></div>
                </form>

            </div>
        </div>
    </main>

</body>

</html>
